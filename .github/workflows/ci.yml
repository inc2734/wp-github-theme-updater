name: CI
on:
  pull_request:
    paths-ignore:
    - '**.md'
  push:
    branches:
    - '**'
    tags:
    - "!*"
    paths-ignore:
    - '**.md'

permissions:
  contents: read

jobs:
  test:
    name: Test

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: 'package.json'
        cache: npm

    - name: Npm install
      run: npm ci

    - name: Running the tests
      run: npm run test
